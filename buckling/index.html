<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="author" content="کامبیز چراغی">
<title>آزمایشگاه کمانش ستون و قاب</title>
<style id="vzface">/* نسخهٔ وب: فونت‌های محلی و Tahoma؛ بدون بارگذاری فونت حجیم یا اتصال خارجی */</style>
<style>
:root{--paper:#eef2f6;--card:#fff;--ink:#0f2236;--ink2:#41586d;--mute:#7589a0;--line:#dbe4ec;--bp:#0d2744;--bp2:#123559;--bpgrid:#1c4673;--cy:#4ff0d2;--am:#ffb454;--tl:#0a8f9c;--tl2:#d9f3f5;--rose:#d8546a;--r:16px;--font:"Vazirmatn","Vazir","IRANSansX","Segoe UI",Tahoma,sans-serif;--math:"Cambria Math",Georgia,"Times New Roman",serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.8 var(--font);font-feature-settings:"kern","liga";text-rendering:optimizeLegibility;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #4ff0d2aa;outline-offset:2px}
.shell{max-width:1360px;margin:0 auto;padding:18px 20px 90px}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:4px 4px 16px}
.brand{display:flex;align-items:center;gap:14px}
.brand svg{flex:none}
.brand h1{margin:0;font-size:23px;line-height:1.3;font-weight:800;letter-spacing:-.2px}
.brand p{margin:0;color:var(--mute);font-size:12.5px;max-width:640px}
.top .tools{display:flex;gap:8px}
/* model chooser */
.models{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.model{position:relative;display:flex;align-items:center;gap:12px;text-align:right;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:11px 14px;transition:border-color .15s,transform .15s,box-shadow .15s}
.model:hover{border-color:#a9c3d6}
.model svg{flex:none;width:46px;height:46px}
.model b{display:block;font-size:14px;line-height:1.4}
.model small{color:var(--mute);font-size:11.5px;line-height:1.4;display:block}
.model.on{border-color:var(--tl);box-shadow:0 0 0 3px #0a8f9c22}
.model.on::after{content:"";position:absolute;top:10px;left:10px;width:9px;height:9px;border-radius:50%;background:var(--tl)}
/* layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(400px,560px);gap:20px;align-items:start}
main>section,.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:14px}
.hd{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.hd h2{margin:0;font-size:16px;font-weight:800}
.hd .n{display:inline-grid;place-items:center;width:23px;height:23px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:700;flex:none;align-self:center}
.hd span.hint{color:var(--mute);font-size:12px}
.note{color:var(--ink2);background:#f3f7fa;border-radius:10px;padding:9px 12px;font-size:12px;margin-top:12px;line-height:1.8}
.note.warn{background:#fff6e5;color:#8a5a10}.note.bad{background:#fff0f0;color:#9c3340}
/* fields */
.row{display:flex;flex-wrap:wrap;gap:10px}
.f{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1 1 110px}
.f>span{font-size:12px;color:var(--ink2);font-weight:600}
.f input,.f select{height:40px;padding:6px 11px;border:1.5px solid var(--line);border-radius:10px;background:#fbfdfe;width:100%;direction:ltr;text-align:left;font-variant-numeric:tabular-nums;transition:border-color .12s,background .12s}
.f select{direction:rtl;text-align:right}
.f input:hover,.f select:hover{border-color:#b7cadb}
.f input:focus,.f select:focus{border-color:var(--tl);background:#fff;outline:none;box-shadow:0 0 0 3px #0a8f9c1f}
.f.xs{flex:0 1 92px}
.f .u{font-size:11px;color:var(--mute);font-weight:400}
/* chips + preset */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 14px;border:1.5px solid var(--line);border-radius:999px;background:#fff;font-size:12.5px;font-weight:600;color:var(--ink2);transition:.12s}
.chip:hover{border-color:#a9c3d6}
.chip.on{border-color:var(--tl);background:var(--tl2);color:#06626c}
.chip svg{width:14px;height:26px}
.chip.add{border-style:dashed;color:var(--tl)}
.seg{position:relative;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding:11px 12px 11px 14px;border:1px solid var(--line);border-right:5px solid var(--c);border-radius:12px;margin-top:9px;background:#fcfdfe}
.seg .sn{font-weight:800;color:var(--ink2);width:18px;text-align:center;align-self:center}
.seg .rng{align-self:center;font-size:12px;color:var(--ink2);background:color-mix(in srgb,var(--c) 14%,#fff);border:1px solid color-mix(in srgb,var(--c) 35%,#fff);border-radius:999px;padding:1px 12px;white-space:nowrap}.seg .rng b{font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}.tot{margin-inline-start:auto;font-size:12.5px;color:var(--ink2)}.tot b{color:var(--tl);font-weight:800}
.seg .pct{align-self:center;min-width:44px;text-align:center;font-size:12px;color:var(--mute);direction:ltr}
.chk{display:flex;align-items:center;gap:6px;align-self:center;font-size:12px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.chk input{width:17px;height:17px;accent-color:var(--tl)}
.mini{border:1px solid var(--line);background:#fff;border-radius:9px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--ink2)}
.mini:hover:not(:disabled){border-color:#a9c3d6}
.mini:disabled{opacity:.4;cursor:not-allowed}
.x{border:0;background:#fdecee;color:#b23a4d;border-radius:8px;width:30px;height:30px;font-size:17px;line-height:1;align-self:center}
.sub{display:flex;gap:8px;margin-top:11px;align-items:center;flex-wrap:wrap}
/* supports */
.ends{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.endbox{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fcfdfe}
.endbox h3{margin:0 0 8px;font-size:13px;font-weight:800}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.opt{display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 2px 5px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:11px;font-weight:600;color:var(--ink2);line-height:1.35;text-align:center;transition:.12s}
.opt svg{width:100%;height:46px}
.opt:hover{border-color:#a9c3d6}
.opt.on{border-color:var(--tl);background:var(--tl2);color:#06626c}
.endbox .row{margin-top:10px}
.mid{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding:11px 12px;border:1px solid var(--line);border-radius:12px;margin-top:9px;background:#fcfdfe}
.empty{padding:14px;text-align:center;color:var(--mute);font-size:12.5px;border:1px dashed var(--line);border-radius:12px}
/* toggles */
.tog{display:inline-flex;background:#eef3f7;border-radius:11px;padding:3px;gap:2px}
.tog button{border:0;background:transparent;padding:7px 14px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.tog button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px #10233a1f}
details.adv{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
details.adv summary{cursor:pointer;font-weight:700;color:var(--ink2);font-size:12.5px}
/* ===== blueprint sheet ===== */
aside{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;scrollbar-width:thin;border-radius:18px}
.sheet{background:var(--bp);color:#e6f1fb;border-radius:18px;overflow:hidden;box-shadow:0 18px 44px -18px #0d274488}
.sheet .bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;border-bottom:1px solid #ffffff1c;flex-wrap:wrap}
.sheet .bar b{font-size:13px;font-weight:700;color:#b6d3ee}
.modes{display:flex;gap:5px}
.modes button{border:1px solid #ffffff2e;background:transparent;color:#b6d3ee;border-radius:8px;padding:2px 11px;font-size:12px;font-weight:600;direction:ltr}
.modes button.on{background:var(--cy);border-color:var(--cy);color:#06303a}
.stage{position:relative;background-color:var(--bp);background-image:linear-gradient(#ffffff0b 1px,transparent 1px),linear-gradient(90deg,#ffffff0b 1px,transparent 1px);background-size:26px 26px}
.stage svg{display:block;width:100%;height:auto}
.play{position:absolute;bottom:10px;right:12px;border:1px solid #ffffff33;background:#0d274499;color:#cfe6f8;border-radius:999px;padding:2px 12px;font-size:11.5px}
/* نتیجه */
.res{padding:18px 20px 4px}
.res-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.res-tag{font-size:12.5px;font-weight:600;color:#9fc0de}
.res-mode{font-size:11px;font-weight:700;color:#06303a;background:var(--cy);border-radius:999px;padding:0 11px;line-height:21px}
.pcr{direction:ltr;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;line-height:1.2;padding:8px 0 2px}
.pcr .sym{font-family:var(--math);font-style:italic;font-size:23px;color:#cfe6f8}
.pcr .sym sub{font-size:.62em;font-style:normal;margin-left:1px}
.pcr b{font-size:46px;font-weight:700;color:var(--cy);letter-spacing:-1.2px;font-variant-numeric:tabular-nums;text-shadow:0 0 22px #4ff0d233}
.pcr .un{font-family:var(--math);font-style:italic;font-size:18px;color:#cfe6f8}
.pcr-eq{direction:ltr;text-align:left;font-size:12px;color:#8fb2d3;font-variant-numeric:tabular-nums;line-height:1.7}
.res-note{font-size:11.5px;color:#8fb2d3;margin-top:4px;line-height:1.8}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px 2px}
.st{background:#ffffff0d;border:1px solid #ffffff16;border-radius:12px;padding:7px 12px 6px}
.st span{display:block;font-size:11px;color:#8fb2d3;line-height:1.55}
.st b{display:block;direction:ltr;text-align:right;font-size:16px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;line-height:1.55}
.st.hi b{color:var(--cy)}
.gauge{padding:10px 20px 16px}.gauge .gt{font-size:11px;color:#8fb2d3;line-height:1.6}
.gauge .g{position:relative;height:8px;border-radius:6px;background:linear-gradient(90deg,#2fc2b4,#6d8cff 50%,#ffb454);margin:14px 0 6px;direction:ltr}
.gauge .g i{position:absolute;top:-5px;width:4px;height:18px;border-radius:3px;background:#fff;box-shadow:0 0 0 3px #0d2744;transform:translateX(-2px)}
.gauge .t{display:flex;justify-content:space-between;font-size:10.5px;color:#8fb2d3;direction:ltr}
.status{margin:12px 16px;padding:9px 12px;border-radius:10px;font-size:12.5px;background:#ffffff14;color:#cfe6f8}
.status.bad{background:#ff6b7f26;color:#ffc0c8}
.status.ok{background:#2fd3b126;color:#aef5e6}
.below{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:10px}
.below .acts{display:flex;flex-wrap:wrap;gap:7px}
.stories{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:10px}
.stories th{color:var(--mute);font-weight:600;text-align:right;padding:4px 6px;border-bottom:1px solid var(--line)}
.stories td{padding:5px 6px;border-bottom:1px solid #edf2f6;direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.stories td:first-child{direction:rtl}
.below h4{margin:2px 0 6px;font-size:12.5px;font-weight:800;color:var(--ink2)}
.below .acts{margin-top:4px}
.below ul{margin:8px 0 0;padding:0 18px;color:var(--ink2);font-size:12px}
/* param card */
.chartbox{position:relative;margin-top:10px;background:#f8fbfd;border:1px solid var(--line);border-radius:12px}
.chartbox svg{display:block;width:100%;height:auto}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:11.5px;padding:5px 9px;border-radius:8px;direction:ltr;white-space:nowrap;transform:translate(-50%,-120%);display:none}
/* signature */
.sig{display:flex;align-items:center;gap:9px;padding:9px 14px;border-top:1px solid #ffffff2e;background:#0a2036;font-size:12px}
.sg-t{color:#8fb2d3}.sig b{color:#fff;font-weight:700;letter-spacing:.1px}
.sg-b{margin-inline-start:auto;border:1px solid #ffffff2e;background:transparent;color:#8fb2d3;border-radius:8px;padding:0 10px;font-size:11px;line-height:22px}
.sg-b:hover{color:#fff;border-color:#ffffff66}
.foot-sig{display:flex;justify-content:center;align-items:center;gap:8px;margin-bottom:6px;font-size:12.5px;color:var(--ink2)}
/* modal */
.modal{position:fixed;inset:0;background:#0d274488;display:none;place-items:center;z-index:50;padding:16px}
.modal.on{display:grid}
.modal .box{background:#fff;border-radius:18px;max-width:640px;width:100%;max-height:86vh;overflow:auto;padding:20px 22px}
.modal h3{margin:0 0 10px}
.t-ok{color:#13805a;font-weight:700}.t-no{color:#b23a4d;font-weight:700}
.tests{width:100%;border-collapse:collapse;font-size:12.5px}
.tests td{padding:5px 6px;border-bottom:1px solid #edf2f6;direction:ltr;text-align:left;font-variant-numeric:tabular-nums}
.tests td:first-child{direction:rtl;text-align:right}
.mbar{display:none}
footer{text-align:center;color:var(--mute);font-size:11.5px;margin-top:22px}
@media(max-width:1020px){.layout{grid-template-columns:1fr}aside{position:static;max-height:none;overflow:visible;order:-1}.models{grid-template-columns:repeat(2,1fr)}
 .mbar{display:flex;position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:20;background:var(--bp);color:#fff;border-radius:999px;padding:7px 18px;gap:12px;align-items:center;box-shadow:0 8px 24px #0d274466;border:1px solid #ffffff33;font-size:13px;direction:ltr;cursor:pointer}
 .mbar b{color:var(--cy);font-family:Georgia,serif;font-size:16px}}
@media(max-width:560px){.shell{padding:10px 10px 90px}.brand h1{font-size:19px}.top .tools{display:none}.byline{font-size:11.5px}.ends{grid-template-columns:1fr}main>section,.card{padding:15px 14px}.model{padding:9px 10px}.model svg{width:36px;height:36px}.model small{display:none}}
@media print{body{background:#fff}.top .tools,.models,main,.below .acts,.mbar,.play,footer,.modes{display:none!important}.layout{display:block}aside{position:static;max-height:none;overflow:visible}.sheet{box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
<style id="kccss">
.kc{position:relative;display:inline-flex;align-items:center;gap:10px;padding:4px 4px 4px 14px;border-radius:999px;overflow:hidden;background:linear-gradient(100deg,#fff1d4,#e6f5f3 72%);border:1px solid #e6c88a;box-shadow:0 8px 18px -12px #c98a1eaa;font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.35;vertical-align:middle;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.kc-av{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#fff1c8,#ffc25c 60%,#f29c2b);box-shadow:0 0 0 2px #fff,0 0 0 3.5px #e6b25a,0 4px 10px -3px #e9a43a99}
.kc-tx{display:flex;flex-direction:column}
.kc-tx small{font-size:10px;color:#9a7437;font-weight:500}
.kc-tx b{font-size:14.5px;font-weight:800;background:linear-gradient(90deg,#6e4204,#c47d12 55%,#6e4204);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.kc-en{direction:ltr;font:600 10.5px/1 Vazirmatn,Tahoma,sans-serif;color:#2d6b78;padding:5px 9px;border-radius:999px;background:#ffffffb8;border:1px solid #cfe0e8;letter-spacing:.3px}
.kc.on-dark{background:linear-gradient(100deg,#ffc97830,#4fe3d616 62%,#ffffff05);border-color:#ffc97860;box-shadow:inset 0 1px 0 #ffffff1a}
.kc.on-dark .kc-av{box-shadow:0 0 0 2px #0a2036,0 0 0 3.5px #ffc97899,0 4px 12px -4px #ffb84d99}
.kc.on-dark .kc-tx small{color:#d9b57a}
.kc.on-dark .kc-tx b{background-image:linear-gradient(90deg,#fff3d6,#ffc978 50%,#fff3d6)}
.kc.on-dark .kc-en{background:#0a1c2c99;border-color:#2b4d68;color:#9fc9cf}
.kc:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 35%,#ffffff55 50%,transparent 65%);transform:translateX(-120%)}
@media(prefers-reduced-motion:no-preference){.kc:after{animation:kcsheen 6s ease-in-out 1.2s infinite}}
@keyframes kcsheen{0%,70%,100%{transform:translateX(-120%)}85%{transform:translateX(120%)}}
@media(max-width:560px){.kc-en{display:none}.kc{padding-left:10px}}
@media print{.kc:after{display:none}}
</style>
<style id="vcss">
.vbtn{background:var(--tl);color:#fff;border-color:var(--tl)}.vbtn:hover:not(:disabled){background:#087986;border-color:#087986}
.modal .box.wide{max-width:1180px}
.vhead{display:flex;gap:14px;align-items:flex-start;justify-content:space-between}.vhead h3{margin:0 0 4px;font-size:19px}.vhead p{margin:0;color:var(--ink2);font-size:13px;line-height:1.9}
.vsum{margin:12px 0 14px;padding:10px 14px;border-radius:12px;font-size:13.5px;background:#e8f7f1;color:#0b6a4a;border:1px solid #bfe6d6}.vsum.no{background:#fff0f0;color:#9c3340;border-color:#f1c3c8}
.vgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.vc{border:1px solid var(--line);border-radius:16px;background:#fff;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 8px 22px -16px #10233a66}
.vc-h{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#12304d;color:#fff}.vc-h h4{margin:0;font-size:14.5px;flex:1;line-height:1.5}
.vn{display:inline-grid;place-items:center;min-width:28px;height:24px;padding:0 6px;border-radius:7px;background:var(--cy);color:#06303a;font-weight:800;font-size:12.5px;direction:ltr}
.vst{font-size:11.5px;font-weight:700;border-radius:999px;padding:0 10px;line-height:22px;background:#2fd3b126;color:#aef5e6}.vc.no .vst{background:#ff6b7f33;color:#ffc0c8}
.vc-fig{background-color:#0d2744;background-image:linear-gradient(#ffffff0b 1px,transparent 1px),linear-gradient(90deg,#ffffff0b 1px,transparent 1px);background-size:26px 26px}.vc-fig svg{display:block;width:100%;height:auto}
.vc-d{padding:10px 14px 4px;font-size:12.5px;color:var(--ink2);line-height:1.9}
.vc-t{width:calc(100% - 28px);margin:6px 14px;border-collapse:collapse;font-size:13px}.vc-t td{padding:5px 6px;border-bottom:1px solid #edf2f6;direction:ltr;text-align:left;font-variant-numeric:tabular-nums}.vc-t td:first-child{direction:rtl;text-align:right;color:var(--ink2)}
.vc-s{display:flex;flex-direction:column;gap:2px;padding:4px 14px 8px;font-size:11.5px;color:var(--mute);direction:ltr;text-align:left}.vc-s em{font-style:normal;color:var(--tl);direction:rtl;text-align:right}
.vc .mini{margin:0 14px 14px;align-self:flex-start}
@media(max-width:900px){.vgrid{grid-template-columns:1fr}}
@media print{.vgrid{display:block}}
</style>
<style id="xcss">
.vbtn2{background:#12304d;color:#fff;border-color:#12304d}.vbtn2:hover:not(:disabled){background:#1b4a76;border-color:#1b4a76}
/* آزمون صحت */
.stlist{display:flex;flex-direction:column;gap:8px}
.str{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}.str.no{border-color:#f1c3c8}
.str-h{display:grid;grid-template-columns:30px 124px 1fr auto 26px 18px;gap:12px;align-items:center;padding:8px 12px;cursor:pointer}.str-h:hover{background:#f4f8fb}
.stn{display:inline-grid;place-items:center;height:26px;border-radius:8px;background:var(--cy);color:#06303a;font-weight:800;font-size:12.5px;direction:ltr}
.stf svg{display:block;width:124px;height:auto;border-radius:8px;border:1px solid #dbe6ee}
.stt b{display:block;font-size:13.5px;line-height:1.6}.stt small{display:block;color:var(--mute);font-size:11.5px;line-height:1.6}
.stv{border-collapse:collapse;font-size:12.5px;direction:ltr;font-variant-numeric:tabular-nums}.stv td{padding:2px 9px;text-align:center}.stv tr:first-child td{color:var(--mute);font-size:11px}.stv td.b{font-weight:800;color:#0b6a4a}
