<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>آدرس جدید پورتال مهندسی</title><style>body{margin:24px;font:16px/1.9 system-ui,Tahoma,sans-serif;color:#172335;background:#f4f6fa}main{max-width:650px;margin:7vh auto;background:white;border:1px solid #dce3ec;border-radius:14px;padding:24px}button{font:inherit;background:#1755a6;color:white;border:0;border-radius:8px;padding:10px 16px;cursor:pointer}button:disabled{opacity:.5}a{color:#1755a6}button[hidden]{display:none}</style></head><body><main><h1>پورتال به آدرس جدید منتقل شده است</h1><p id="status" role="status">در حال بررسی اطلاعات ذخیره‌شده در این مرورگر…</p><button id="start" hidden>انتقال اطلاعات و ورود به سایت جدید</button><p><a id="go" href="https://portal-private.pages.dev/">ورود مستقیم به سایت جدید بدون انتقال</a></p><noscript>برای انتقال اطلاعات قبلی، جاوااسکریپت را فعال کنید.</noscript></main><script>
'use strict';
const PREVIEW=false;
const OLD='https://kambiz-cheraghi.github.io', NEW='https://portal-private.pages.dev', MARK='portal-migration-completed-v1';
const keys=new Set(['portal-language','portal-theme','beam_analysis_studio_seen_6.0','beton-yar-v1','buckling-lang','dyn-lang','calc-theme','calc-hist-v2','calc_view','calc-edu','calc-course','calc-anim','hesaban_seen_3.2','fl_guide','framelab_seen_3.4','moqta-yar-v3','moqta-guide-v4','iran2800_report_source_url','iran2800_c_draft_v6','iran2800_c_project_store_v4','iran2800_c_project_store_v3','iran2800_ed4_draft_v1','iran2800_edition_v1','staticyar-current','staticyar-font','kc_rev','kc_lic']);
for(const app of ['buckling','calculus','dyn','s2800','statics']){keys.add('kc_use_'+app);keys.add('kl_win_'+app)}

function getTarget(){if(PREVIEW)return '/calc/'; const p=location.pathname; let path=p==='/portal'?'/':p.startsWith('/portal/')?p.slice('/portal'.length):'/'; if(path.startsWith('//')||path.includes('\\')||/^\/migrate(?:\.html)?\/?$/i.test(path))return '/'; const url=new URL(path+location.search+location.hash,NEW); if(url.origin!==NEW)return '/';return url.pathname+url.search+url.hash;}
const path=getTarget(), destination=new URL(path,NEW).href;
const status=document.getElementById('status'),start=document.getElementById('start'),go=document.getElementById('go'); go.href=destination;
let child=null,nonce=null,entries=[],sent=false,timer;
function stop(message){clearInterval(timer);status.textContent=message;start.disabled=false;child=null;nonce=null;entries=[];sent=false;}
function readEntries(){return [...keys].map(k=>[k,localStorage.getItem(k)]).filter(p=>p[1]!==null);}
window.addEventListener('message',e=>{if(!child||e.source!==child||e.origin!==NEW||!e.data)return;const d=e.data;if(d.type==='portal-migrate-ready-v1'&&!sent){sent=true;child.postMessage({type:'portal-migrate-data-v1',nonce,path,entries},NEW);status.textContent='داده‌ها ارسال شدند؛ نتیجه را در پنجره جدید بررسی کنید.';}else if(d.nonce===nonce&&sent&&d.type==='portal-migrate-done-v1'){const count=entries.length;if(!PREVIEW){try{localStorage.setItem(MARK,'1')}catch(_){}}stop('انتقال موفق بود. تعداد کلیدهای ارسالی: '+count+'؛ مقصد در پنجره جدید باز می‌شود.');start.hidden=true;go.textContent='ورود به سایت جدید در همین تب';}else if(d.nonce===nonce&&sent&&d.type==='portal-migrate-error-v1'){stop('انتقال انجام نشد. اطلاعات قبلی حذف نشده‌اند. دوباره تلاش کنید یا مستقیم وارد شوید.');}});
start.onclick=()=>{if(location.origin!==OLD){stop('انتقال فقط در آدرس قدیمی امکان‌پذیر است.');return;}try{entries=readEntries();nonce=crypto.randomUUID();}catch(_){stop('حافظه مرورگر در دسترس نیست.');return;}child=window.open(NEW+'/migrate.html','_blank');if(!child){stop('مرورگر پنجره جدید را مسدود کرد. اجازه باز شدن پنجره را بدهید و دوباره تلاش کنید.');return;}start.disabled=true;sent=false;status.textContent='در انتظار ارتباط با سایت جدید…';const begin=Date.now();timer=setInterval(()=>{if(!child||child.closed)stop('پنجره بسته شد؛ نتیجه انتقال تأیید نشد.');else if(!sent&&Date.now()-begin>30000)stop('ارتباط با سایت جدید برقرار نشد.');},500);};
async function init(){if(location.origin!==OLD){status.textContent='این صفحه باید روی نشانی قدیمی پورتال باشد.';return;}if(!PREVIEW&&'serviceWorker'in navigator){try{await Promise.race([navigator.serviceWorker.register('/portal/sw.js',{scope:'/portal/'}),new Promise(r=>setTimeout(r,1500))]);}catch(_){}}try{if(!PREVIEW&&(localStorage.getItem(MARK)==='1'||readEntries().length===0)){location.replace(destination);return;}if(PREVIEW){status.textContent='آزمایش مسیر مستقیم برنامه حسابان؛ اطلاعات قبلی حذف نمی‌شوند.';}else{status.textContent='برای حفظ مجوزها، تنظیمات و پروژه‌های قبلی، یک بار دکمه انتقال را بزنید. اطلاعات سایت قبلی حذف نمی‌شوند.';}start.hidden=false;}catch(_){status.textContent='حافظه مرورگر در دسترس نیست؛ می‌توانید مستقیم وارد شوید.';}}
init();
</script></body></html>
