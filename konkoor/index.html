<style>
:root{--bg:#070d1a;--panel:#0d1830;--panel2:#12213f;--line:#1f3254;--line2:#2c4574;--text:#e9eefb;--mut:#9aacce;--faint:#6f83a8;--gold:#ffc978;--gold2:#ffb84d;--teal:#46e3d1;--grid:rgba(110,150,225,.07);--ink:#3a2205;--shadow:0 22px 50px -26px rgba(0,0,0,.9);--paper:#fff;
 --font:'Vazirmatn','Segoe UI',Tahoma,'Noto Sans Arabic',Arial,sans-serif}
:root[data-theme="light"]{--bg:#eef2f9;--panel:#fff;--panel2:#f4f7fc;--line:#d2dcee;--line2:#b6c5e0;--text:#0e1a33;--mut:#4d6089;--faint:#7384a6;--gold:#9a6a12;--gold2:#c98a1b;--teal:#08857a;--grid:rgba(40,80,160,.06);--shadow:0 20px 40px -28px rgba(30,55,110,.55)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.8;min-height:100vh;
 background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 6px}
.back,.tbtn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:11px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 80%,transparent);color:var(--mut);font-size:13.5px;text-decoration:none}
.back:hover,.tbtn:hover{border-color:var(--line2);color:var(--text)}
.back svg,.tbtn svg{width:17px;height:17px}
.hero{padding:34px 0 8px}
.hero h1{margin:0;font-size:clamp(26px,4.6vw,44px);line-height:1.4;font-weight:900}
.hero h1 span{display:block;font-size:.55em;font-weight:700;color:var(--gold);margin-top:2px}
.hero p{margin:12px 0 0;max-width:60ch;color:var(--mut);font-size:15px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.stat{padding:6px 14px;border:1px solid var(--line);border-radius:30px;font-size:13px;color:var(--mut);background:color-mix(in srgb,var(--panel) 70%,transparent)}
.stat b{color:var(--text)}
.lvls{display:inline-flex;gap:4px;padding:4px;margin-top:22px;border:1px solid var(--line2);border-radius:14px;background:color-mix(in srgb,var(--panel) 80%,transparent)}
.lvls button{border:0;background:transparent;color:var(--mut);border-radius:10px;padding:6px 22px;font-size:15px;font-weight:700}
.lvls button:hover{color:var(--text)}
.lvls button[aria-selected=true]{background:var(--gold2);color:var(--ink)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 6px;position:sticky;top:0;z-index:5;padding:10px 0;background:linear-gradient(var(--bg) 70%,transparent)}
.tabs button{border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:30px;padding:5px 18px;font-size:14px;font-weight:500}
.tabs button:hover{color:var(--text);border-color:var(--line2)}
.tabs button[aria-selected=true]{background:var(--gold2);border-color:var(--gold2);color:var(--ink);font-weight:800}
.tabs button.f{border-color:color-mix(in srgb,var(--gold) 55%,transparent);color:var(--gold)}
.tabs button.f[aria-selected=true]{color:var(--ink)}
.sech{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:14px 0 14px}
.sech h2{margin:0;font-size:20px}
.sech small{color:var(--faint);font-size:13px;margin-inline-start:10px;font-weight:400}
.dl{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:11px;text-decoration:none;font-size:13.5px;font-weight:700;background:linear-gradient(100deg,#ffe3a6,#ffb84d);color:var(--ink)}
.dl svg{width:16px;height:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;padding-bottom:50px}
.q{position:relative;display:flex;flex-direction:column;text-align:right;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:8px 8px 10px;box-shadow:var(--shadow);transition:transform .18s,border-color .18s}
.q:hover{transform:translateY(-3px);border-color:var(--gold2)}
.q .th{position:relative;border-radius:8px;overflow:hidden;background:var(--paper);aspect-ratio:1/1.35;display:grid;place-items:center}
.q canvas{display:block;width:100%;height:auto}
.q .th.ld:after{content:"";width:22px;height:22px;border-radius:50%;border:3px solid #cfd8ea;border-top-color:var(--gold2);animation:sp .8s linear infinite;position:absolute}
@keyframes sp{to{transform:rotate(360deg)}}
.q .lb{display:flex;align-items:baseline;gap:8px;margin-top:9px;padding:0 4px;font-size:14px;font-weight:700}
.q .lb i{font-style:normal;font-size:12px;color:var(--faint);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q.f{border-color:color-mix(in srgb,var(--gold) 60%,transparent)}
.q.f .lb{color:var(--gold)}
.q .no{position:absolute;top:14px;inset-inline-start:14px;min-width:28px;height:28px;padding:0 8px;border-radius:9px;background:#070d1ae6;color:var(--gold);font-size:13px;font-weight:800;display:grid;place-items:center;border:1px solid #2c4574}
.msg{padding:50px 16px;text-align:center;color:var(--mut);border:1px dashed var(--line2);border-radius:16px;margin-bottom:40px}
.foot{padding:10px 0 40px;text-align:center;font-size:13px;color:var(--faint)}
.foot b{color:var(--gold)}
/* نمایشگر */
.vw{position:fixed;inset:0;z-index:30;background:#050a18;display:none;flex-direction:column}
.vw.on{display:flex}
.vbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;color:#e9eefb}
.vbar .t{min-width:0;font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbar .t small{color:#9aacce;font-weight:400;margin-inline-start:8px}
.vbtns{display:flex;gap:6px;flex:none}
.vb{width:40px;height:40px;border-radius:11px;border:1px solid #2c4574;background:#0d1830;color:#e9eefb;display:grid;place-items:center;font-size:18px}
.vb:hover{border-color:var(--gold2)}
.vb svg{width:18px;height:18px}
.vsc{flex:1;min-height:0;overflow:auto;display:grid;place-items:start center;padding:6px 10px 80px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.vsc canvas{background:#fff;border-radius:6px;box-shadow:0 10px 40px #000a;max-width:none;transition:width .18s}
.vnav{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:40px;background:#0d1830ee;border:1px solid #2c4574;color:#e9eefb}
.vnav .vb{width:42px;height:42px;border-radius:50%}
.vnav span{min-width:64px;text-align:center;font-size:14px}
.vsp{position:absolute;inset:0;display:none;place-items:center;pointer-events:none}
.vsp.on{display:grid}
.vsp:after{content:"";width:34px;height:34px;border-radius:50%;border:4px solid #2c4574;border-top-color:var(--gold2);animation:sp .8s linear infinite}
.toast{position:fixed;z-index:40;inset-inline:0;bottom:84px;display:flex;justify-content:center;pointer-events:none}
.toast span{padding:9px 18px;border-radius:12px;background:#e9eefb;color:#070d1a;font-size:14px;font-weight:600;opacity:0;transform:translateY(10px);transition:all .25s}
.toast.on span{opacity:1;transform:none}
@media(max-width:560px){.wrap{padding:0 14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.back span{display:none}.back{padding:0 11px}.q .lb i{display:none}}
@media(prefers-reduced-motion:reduce){.q,.vsc canvas{transition:none}.q .th.ld:after,.vsp:after{animation-duration:2s}}
canvas{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
@media print{.vw,.tabs,.top .tbtn,.grid,.sech{display:none!important}.hero:after{content:'چاپ این صفحه فعال نیست.';display:block;margin-top:20px}}
</style>
